<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ item ? 'Edit' : shopping ? 'Add item' : 'New task' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="Close" (click)="dismiss(false)">
        <ion-icon slot="icon-only" name="close" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input
      [label]="shopping ? 'Item' : 'Task'"
      labelPlacement="stacked"
      type="text"
      maxlength="500"
      [(ngModel)]="name"
    ></ion-input>
    <ion-button slot="end" size="large" fill="clear" color="medium" aria-label="Dictate" (click)="inputVoice('name')">
      <ion-icon slot="icon-only" name="mic" aria-hidden="true"></ion-icon>
    </ion-button>
  </ion-item>

  <ion-item>
    <ion-textarea
      [label]="shopping ? 'Amount / notes' : 'Notes'"
      labelPlacement="stacked"
      [autoGrow]="true"
      maxlength="5000"
      [(ngModel)]="description"
    ></ion-textarea>
    <ion-button slot="end" size="large" fill="clear" color="medium" aria-label="Dictate" (click)="inputVoice('description')">
      <ion-icon slot="icon-only" name="mic" aria-hidden="true"></ion-icon>
    </ion-button>
  </ion-item>

  @if (!shopping) {
    <ion-item>
      <ion-input
        label="Remind me"
        labelPlacement="stacked"
        type="datetime-local"
        helperText="Sent as a notification to everyone on this list"
        [(ngModel)]="remindAt"
      ></ion-input>
      @if (remindAt()) {
        <ion-button slot="end" fill="clear" color="medium" aria-label="Remove reminder" (click)="remindAt.set('')">
          <ion-icon slot="icon-only" name="close" aria-hidden="true"></ion-icon>
        </ion-button>
      }
    </ion-item>
  }

  @if (shopping) {
    <ion-item>
      <ion-select label="Aisle" labelPlacement="stacked" interface="action-sheet" [(ngModel)]="category">
        @for (c of categories; track c) {
          <ion-select-option [value]="c">{{ c }}</ion-select-option>
        }
      </ion-select>
    </ion-item>
  }

  <!-- ponytail: photo buttons removed; Cloud Storage needs the paid Blaze plan.
       Restore takePicture()/pickFromLibrary() buttons from upstream if you upgrade. -->

  @if (image()) {
    <img class="preview" [src]="image()" alt="" />
  }

  <ion-item lines="none">
    <ion-checkbox justify="start" labelPlacement="end" [(ngModel)]="state">
      {{ shopping ? 'In the basket' : 'Done' }}
    </ion-checkbox>
  </ion-item>

  <ion-row class="ion-padding-top">
    <ion-col>
      <ion-button fill="outline" color="medium" expand="block" (click)="dismiss(false)">Cancel</ion-button>
    </ion-col>
    <ion-col>
      @if (item) {
        <ion-button expand="block" [disabled]="!name().trim()" (click)="updateItem()">Save</ion-button>
      } @else {
        <ion-button expand="block" [disabled]="!name().trim()" (click)="addItem()">Add</ion-button>
      }
    </ion-col>
  </ion-row>
</ion-content>
