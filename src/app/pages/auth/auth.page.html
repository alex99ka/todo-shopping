<ion-content [forceOverscroll]="false">
  <main class="welcome">
    <img class="logo" src="assets/imgs/logo.png" alt="" width="96" height="96" />
    <h1>משימות וקניות</h1>
    <p class="lede">רשימות משימות משותפות ורשימת קניות שמסתדרת לבד לפי מחלקות — לך ולכל הבית.</p>
    <ion-button expand="block" shape="round" class="google" (click)="signInGoogle()">
      <ion-icon slot="start" name="logo-google" aria-hidden="true"></ion-icon>
      כניסה עם Google
    </ion-button>
    <p class="fine">אנחנו משתמשים רק בשם, במייל ובתמונה מחשבון Google כדי להראות מי הוסיף מה.</p>
  </main>
</ion-content>
