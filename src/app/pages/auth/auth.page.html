<ion-content [forceOverscroll]="false">
  <main class="welcome">
    <img class="logo" src="assets/imgs/logo.png" alt="" width="96" height="96" />
    <h1>Todo and Shopping</h1>
    <p class="lede">Shared to-do lists and a shopping list that sorts itself by aisle — for you and your household.</p>
    <ion-button expand="block" shape="round" class="google" (click)="signInGoogle()">
      <ion-icon slot="start" name="logo-google" aria-hidden="true"></ion-icon>
      Continue with Google
    </ion-button>
    <p class="fine">We only use your Google name, email and photo to show who added what.</p>
  </main>
</ion-content>
