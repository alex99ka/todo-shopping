<ion-app>
  @if (user(); as profile) {
    <ion-menu contentId="main-content" menuId="myMenu">
      <ion-header class="navigation-drawer">
        <div class="profil">
          <img class="profil-img" [src]="profile.photoURL" alt="" referrerpolicy="no-referrer" />
          <p class="profil-text">
            <ion-text color="light">
              <b>{{ profile.displayName }}</b>
              <br />{{ profile.email }}
            </ion-text>
          </p>
        </div>
      </ion-header>
      <ion-content class="ion-padding-vertical">
        <ion-menu-toggle>
          <ion-item
            button
            lines="none"
            routerLink="/home"
            routerLinkActive="selected"
            #homeLink="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <ion-icon
              slot="start"
              name="list-circle"
              aria-hidden="true"
              [color]="homeLink.isActive ? 'primary' : 'medium'"
            ></ion-icon>
            <ion-label [color]="homeLink.isActive ? 'primary' : ''">My lists</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item
            button
            lines="none"
            routerLink="/households"
            routerLinkActive="selected"
            #householdsLink="routerLinkActive"
          >
            <ion-icon
              slot="start"
              name="home"
              aria-hidden="true"
              [color]="householdsLink.isActive ? 'primary' : 'medium'"
            ></ion-icon>
            <ion-label [color]="householdsLink.isActive ? 'primary' : ''">Households</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item
            button
            lines="none"
            routerLink="/settings"
            routerLinkActive="selected"
            #settingsLink="routerLinkActive"
          >
            <ion-icon
              slot="start"
              name="settings"
              aria-hidden="true"
              [color]="settingsLink.isActive ? 'primary' : 'medium'"
            ></ion-icon>
            <ion-label [color]="settingsLink.isActive ? 'primary' : ''">Settings</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item button lines="none" (click)="confirmSignOut()">
            <ion-icon slot="start" name="log-out" aria-hidden="true"></ion-icon>
            <ion-label>Sign Out</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-content>
    </ion-menu>
  }
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
