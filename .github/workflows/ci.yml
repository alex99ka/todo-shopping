name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The App Link (AndroidManifest) only verifies if Hosting serves this file.
      - run: test -s www/.well-known/assetlinks.json
      - run: node --test 'test/unit/**/*.test.ts'
      - run: npm run test:rules
      - run: npm run test:services
